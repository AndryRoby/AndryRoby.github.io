<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#8DB4C8">
<title>Whistle Stop (test build) · ARLing Labs</title>
<meta name="description" content="Internal feel test of an idle western town. Not a release.">
<link rel="preload" href="ARLingDrawText-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="whistle.css">
<script type="module" src="hra.mjs"></script>
</head>
<body>
<main id="hra">
  <div id="scena" tabindex="0" role="img" aria-label="A western street drawn like a paper theatre: a well with a windmill, a General Store and a closed Barber. People walk left and right and shop at the store. Tap a building, or use the arrow keys and Enter.">
    <img id="v-nebo" alt="">
    <img id="v-hory" class="posuvna" alt="">
    <img id="v-trat" class="posuvna" alt="">
    <div id="v-ulica" class="posuvna">
      <img id="v-zem" alt="">
      <img id="b-0" alt="">
      <img id="v-lopatky" alt="">
      <img id="b-2" alt="">
      <div id="obal-obchod"><img id="b-1" alt=""></div>
      <canvas id="v-dvere"></canvas>
      <div id="lista"><div id="lista-plna"></div></div>
    </div>
    <canvas id="platno"></canvas>
    <div id="vietor"></div>
    <div id="mince"></div>
    <img id="v-popredie" class="posuvna" alt="">
    <div id="interier" hidden><img id="i-podlaha" alt=""><canvas id="i-zivy"></canvas><img id="i-menovky" alt=""></div>
  </div>

  <header class="hore">
    <h1>Whistle Stop</h1>
    <p class="peniaze" aria-live="off"><span id="suma">$0</span><span id="zaS">tap to serve</span></p>
  </header>

  <div class="nastroje">
    <button id="zvuk" type="button" aria-pressed="true">Sound on</button>
    <button id="noc" type="button" aria-pressed="false">Night</button>
  </div>

  <button id="vlavo" class="sipka" type="button" aria-label="Previous building">&lsaquo;</button>
  <button id="vpravo" class="sipka" type="button" aria-label="Next building">&rsaquo;</button>

  <p id="sprava" class="sprava" role="status" hidden></p>
  <p id="upozornenie" class="sprava" hidden>Progress won't be saved in this window.</p>

  <section id="karta" class="karta" data-mod="obchod" aria-live="polite">
    <h2 id="k-meno">General Store</h2>
    <p class="riadok"><span id="k-uroven">Level 1</span></p>
    <p id="k-prijem" class="popis"></p>
    <p id="k-dalsie" class="dalsie"></p>

    <div class="len-obchod">
      <div class="kupa">
        <div class="prepinac" role="group" aria-label="How many levels">
          <button id="k-x1" type="button" aria-pressed="true">x1</button>
          <button id="k-x10" type="button" aria-pressed="false">x10</button>
        </div>
        <button id="k-kup" class="hlavne" type="button">Buy 1</button>
      </div>
      <div class="rad">
        <button id="k-najmi" type="button">Hire a manager</button>
        <p id="k-manazer" class="manazer" hidden></p>
        <button id="k-interier" type="button">Interior</button>
      </div>
      <p id="veta" class="veta" hidden></p>
    </div>

    <div class="len-studna">
      <button id="k-tuk" type="button">Draw a bucket</button>
    </div>

    <div class="len-interier">
      <div id="k-miesta" class="miesta" role="group" aria-label="Furniture spots">
        <button type="button">Counter</button><button type="button">Shelves</button><button type="button">Barrels</button>
        <button type="button">Scale</button><button type="button">Stove</button><button type="button">Storeroom</button>
      </div>
      <div class="rad">
        <button id="k-kus" class="hlavne" type="button">Buy</button>
        <button id="k-spat" type="button">Back to the street</button>
      </div>
    </div>
  </section>

  <p class="labs">ARLing Labs: internal feel test (M0). Not public, not a release.</p>
</main>
</body>
</html>
